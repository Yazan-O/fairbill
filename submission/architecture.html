<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fairbill architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Geist', sans-serif; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 32px 20px; }
  .eyebrow { font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; color: #4f5d75; text-transform: uppercase; margin: 0 0 8px; }
  h1 { font: 400 28px 'Instrument Serif', serif; margin: 0 0 4px; }
  .sub { font: 400 12px 'Geist', sans-serif; color: #4f5d75; margin: 0 0 24px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Fairbill · Strands Agents on Amazon Bedrock AgentCore</p>
  <h1>A bill goes in, a cited decision comes out</h1>
  <p class="sub">Three specialists propose claims in parallel. A deterministic validator rebuilds every citation from the hospital's own price file. Nothing a model wrote reaches the letter.</p>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" font-family="'Geist', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="200" y="48" width="888" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="216" y="52" width="232" height="12" rx="2" fill="#f5f5f5"/>
  <text x="332" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AGENTCORE RUNTIME · US-EAST-1 · ARM64</text>

  <rect x="424" y="84" width="176" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="436" y="88" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="512" y="97" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STRANDS GRAPH · PARALLEL</text>

  <!-- arrows (before boxes) -->
  <!-- phone -> reader -->
  <line x1="160" y1="232" x2="232" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="176" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="196" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHOTO</text>

  <!-- reader -> three specialists (fanned attach points 216 / 232 / 248) -->
  <path d="M376,216 H400 Q408,216 408,208 V152 Q408,144 416,144 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="376" y1="232" x2="440" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M376,248 H400 Q408,248 408,256 V312 Q408,320 416,320 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- specialists -> validator (fanned attach points 216 / 232 / 248) -->
  <path d="M584,144 H612 Q620,144 620,152 V208 Q620,216 628,216 H656" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="584" y1="232" x2="656" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M584,320 H612 Q620,320 620,312 V256 Q620,248 628,248 H656" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- price file -> validator (the headline rule) -->
  <path d="M376,384 H720 Q728,384 728,376 V264" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="488" y="364" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="548" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-DERIVE CITATIONS</text>

  <!-- validator -> decision card -->
  <line x1="800" y1="232" x2="856" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="800" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="828" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FINDINGS</text>

  <!-- decision card -> guard + ledger -->
  <line x1="952" y1="264" x2="952" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="964" y="294" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="968" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EVERY ACTION</text>

  <!-- reader -> price file (hospital resolved, file fetched) -->
  <line x1="304" y1="264" x2="304" y2="336" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="316" y="294" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="320" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FETCH</text>

  <!-- nodes -->
  <!-- phone (input) -->
  <rect x="32" y="200" width="128" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="200" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="40" y="206" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="58" y="215" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="96" y="238" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Phone (QR link)</text>
  <text x="96" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">photo in · card out</text>

  <!-- reader -->
  <rect x="232" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="232" y="200" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="240" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="260" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="304" y="238" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Reader</text>
  <text x="304" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deskew · Bill schema</text>

  <!-- price file (store) -->
  <rect x="232" y="336" width="144" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="232" y="336" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="240" y="342" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="260" y="351" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="304" y="374" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Hospital price file</text>
  <text x="304" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live 39 MB · sha256 · slice</text>

  <!-- specialists -->
  <rect x="440" y="116" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="440" y="116" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="512" y="142" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Line matcher</text>
  <text x="512" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">duplicate · above cash</text>

  <rect x="440" y="204" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="440" y="204" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="512" y="230" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Coding specialist</text>
  <text x="512" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unbundled · upcoded</text>

  <rect x="440" y="292" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="440" y="292" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="512" y="318" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Rights specialist</text>
  <text x="512" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">No Surprises Act</text>

  <!-- validator (focal) -->
  <rect x="656" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="656" y="200" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="664" y="206" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text x="688" y="215" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PYTHON</text>
  <text x="728" y="238" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Validator</text>
  <text x="728" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same bar, both models</text>

  <!-- decision card -->
  <rect x="856" y="200" width="192" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="856" y="200" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="864" y="206" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="888" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
  <text x="952" y="238" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Decision Card</text>
  <text x="952" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">options · letter · deadline .ics</text>

  <!-- guard + ledger (security boundary) -->
  <rect x="856" y="336" width="192" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="856" y="336" width="192" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="864" y="342" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text x="886" y="351" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
  <text x="952" y="374" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Guard hook + Ledger</text>
  <text x="952" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pay_bill denied · undo</text>

  <!-- legend -->
  <line x1="32" y1="456" x2="1088" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="112" y="468" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="136" y="477" fill="#4f5d75" font-size="9">Deterministic gate: drops any claim it cannot rebuild from the file</text>

  <rect x="512" y="468" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="536" y="477" fill="#4f5d75" font-size="9">Strands Agent (Sonnet 4.6, Haiku 4.5 fallback)</text>

  <rect x="784" y="468" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="808" y="477" fill="#4f5d75" font-size="9">Public data (CMS price transparency)</text>

  <line x1="32" y1="500" x2="64" y2="500" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="72" y="503" fill="#4f5d75" font-size="9">Network call (phone, hospital URL)</text>

  <line x1="296" y1="500" x2="328" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="336" y="503" fill="#4f5d75" font-size="9">In-process data flow</text>

  <rect x="512" y="494" width="16" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="536" y="503" fill="#4f5d75" font-size="9">Guard boundary: BeforeToolCall intervention, enforced in code</text>
</svg>
</div>
</body>
</html>
