<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-label="Fairbill request path: phone to Lambda Function URL to AgentCore Runtime to Amazon Bedrock, with the event stream flowing back to the phone.">
  <title>Fairbill request path</title>
  <desc>One URL. The phone calls a Lambda Function URL in response-streaming mode on Node 22, which invokes the AgentCore Runtime direct-code deployment on Python 3.13 and ARM64, which calls Amazon Bedrock with Sonnet 4.6 primary and Haiku 4.5 as the same-bar fallback. Progress events stream back to the phone.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
    <marker id="rp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="rp-arrow-mist" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="384" fill="#f5f5f5"/>

  <text x="60" y="44" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.14em">REQUEST PATH &#183; ONE URL &#183; US-EAST-1</text>

  <!-- arrows first, so boxes sit on top -->
  <line x1="240" y1="136" x2="280" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rp-arrow)"/>
  <line x1="460" y1="136" x2="500" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rp-arrow)"/>
  <line x1="680" y1="136" x2="720" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rp-arrow)"/>
  <path d="M 810,184 V 272 Q 810,280 802,280 H 158 Q 150,280 150,272 V 188" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rp-arrow-mist)"/>

  <!-- arrow labels: mask sits 8px above the stroke -->
  <rect x="242" y="116" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="260" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
  <rect x="462" y="116" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="480" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">INVOKE</text>
  <rect x="682" y="116" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="700" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MODEL</text>
  <rect x="436" y="288" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="480" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT STREAM</text>

  <!-- 1. Phone -->
  <rect x="60" y="88" width="180" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="60" y="88" width="180" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="68" y="96" width="32" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="84" y="105" fill="#7a8399" font-size="7" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="150" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Phone</text>
  <text x="150" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">QR link</text>
  <text x="150" y="168" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">no login, no setup</text>

  <!-- 2. Lambda Function URL -->
  <rect x="280" y="88" width="180" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="280" y="88" width="180" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="288" y="96" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="304" y="105" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
  <text x="370" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Lambda Function URL</text>
  <text x="370" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">Node 22</text>
  <text x="370" y="168" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">response streaming</text>

  <!-- 3. AgentCore Runtime (focal) -->
  <rect x="500" y="88" width="180" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="88" width="180" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="508" y="96" width="36" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="526" y="105" fill="#eb6c36" font-size="7" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
  <text x="590" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">AgentCore Runtime</text>
  <text x="590" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">direct code deploy</text>
  <text x="590" y="168" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">Python 3.13, ARM64</text>

  <!-- 4. Amazon Bedrock -->
  <rect x="720" y="88" width="180" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="88" width="180" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="728" y="96" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="746" y="105" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
  <text x="810" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Amazon Bedrock</text>
  <text x="810" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">Sonnet 4.6 primary</text>
  <text x="810" y="168" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, monospace" text-anchor="middle">Haiku 4.5 fallback</text>

  <!-- legend -->
  <line x1="60" y1="324" x2="900" y2="324" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="60" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="140" y1="344" x2="172" y2="344" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="180" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">Request, one HTTPS origin</text>
  <line x1="392" y1="344" x2="424" y2="344" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="432" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">Progress events back to the phone</text>
  <rect x="720" y="338" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="740" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, monospace">Agent code runs here</text>
</svg>
